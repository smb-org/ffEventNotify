version: 2
updates:
  # Keeps the pinned Node base image in the Dockerfile on the latest patch.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node 24 LTS line; major upgrades are done by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
