services:
  bot:
    image: ghcr.io/smb-org/ffeventnotify:${FFE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/ffeventnotify.sqlite
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
